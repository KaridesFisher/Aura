<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Aura — Your screen. Your rhythm.</title>
  <desc id="desc">A dark mint-accented illustration of a native Mac media player, with abstract mountain artwork. This is a project illustration, not a screenshot of a user's library.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1517"/><stop offset="1" stop-color="#142325"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#293f48"/><stop offset="1" stop-color="#677b77"/></linearGradient>
    <linearGradient id="mountain" x2="1" y2="1"><stop stop-color="#365b57"/><stop offset="1" stop-color="#142c30"/></linearGradient>
    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#071517" stop-opacity="0"/><stop offset="1" stop-color="#071517" stop-opacity=".9"/></linearGradient>
    <clipPath id="screen"><rect x="650" y="139" width="548" height="324" rx="12"/></clipPath>
  </defs>
  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="1173" cy="80" r="236" fill="#86e8c3" opacity=".035"/>
  <circle cx="738" cy="548" r="220" fill="#86e8c3" opacity=".025"/>
  <path d="M70 95h38l17 36-23 39H68l-18-37z" fill="none" stroke="#97ebc9" stroke-width="2" opacity=".85"/>
  <path d="m64 144 23-31 22 31m-35-11h27" stroke="#97ebc9" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="69" y="243" fill="#eaf7f1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="104" font-weight="300" letter-spacing="-6">aura</text>
  <text x="74" y="298" fill="#97ebc9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="400">Your screen. Your rhythm.</text>
  <text x="74" y="350" fill="#9bb0ad" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">A native IPTV player for macOS.</text>
  <text x="74" y="378" fill="#9bb0ad" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Live TV, stories and the place you left off.</text>
  <rect x="74" y="425" width="125" height="34" rx="17" fill="#97ebc9" fill-opacity=".09" stroke="#97ebc9" stroke-opacity=".2"/>
  <text x="136" y="447" text-anchor="middle" fill="#97ebc9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">BUILT FOR MAC</text>
  <rect x="212" y="425" width="124" height="34" rx="17" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".09"/>
  <text x="274" y="447" text-anchor="middle" fill="#b8cbc4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">OPEN SOURCE</text>
  <rect x="590" y="98" width="630" height="407" rx="19" fill="#081112" stroke="#42605a" stroke-opacity=".6"/>
  <circle cx="611" cy="119" r="4" fill="#e08b81"/><circle cx="626" cy="119" r="4" fill="#d4bc78"/><circle cx="641" cy="119" r="4" fill="#8ec5a3"/>
  <text x="1195" y="123" text-anchor="end" fill="#68877e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" letter-spacing="2">AURA / PLAYER</text>
  <path d="M622 170h-10m0 0 4-4m-4 4 4 4" stroke="#97ebc9" stroke-width="1.5" fill="none"/>
  <path d="M610 216h17m-17 5h13m-13 5h17M610 265h17m-17 5h13m-13 5h17M610 314h17m-17 5h13m-13 5h17" stroke="#63877b" stroke-width="1.5" opacity=".65"/>
  <g clip-path="url(#screen)">
    <rect x="650" y="139" width="548" height="324" fill="url(#sky)"/>
    <circle cx="1059" cy="204" r="39" fill="#e5d4aa" opacity=".8"/>
    <path d="m610 432 187-245 135 167 99-121 186 252z" fill="#688681"/>
    <path d="m650 430 150-208 68 121-28-12-40-62-54 94z" fill="#b4c2af" opacity=".75"/>
    <path d="m812 463 170-218 80 99 51-40 124 173z" fill="url(#mountain)"/>
    <path d="m972 258 15-10 42 56-32-18z" fill="#c5d2bd" opacity=".6"/>
    <rect x="650" y="139" width="548" height="324" fill="url(#shade)"/>
    <text x="679" y="389" fill="#adc8b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" letter-spacing="2.3">SPACE TO GET LOST</text>
    <text x="678" y="421" fill="#edf6ec" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="300">A world of your own.</text>
  </g>
  <rect x="676" y="477" width="365" height="2" rx="1" fill="#2c4540"/><rect x="676" y="477" width="146" height="2" rx="1" fill="#97ebc9"/>
  <circle cx="822" cy="478" r="3" fill="#97ebc9"/>
  <path d="M1067 474v8m4-8v8" stroke="#97ebc9" stroke-width="2"/>
  <text x="1185" y="482" text-anchor="end" fill="#8cab9f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9">JUST PRESS PLAY</text>
  <path d="M74 527h1132" stroke="#97ebc9" stroke-opacity=".1"/>
  <text x="74" y="554" fill="#69877c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" letter-spacing="2">LIVE TV / MOVIES / SERIES</text>
  <text x="1206" y="554" text-anchor="end" fill="#69877c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" letter-spacing="2">BRING YOUR OWN STREAMS</text>
</svg>
